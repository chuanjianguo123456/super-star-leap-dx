name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless canvas
        working-directory: tools
        run: npm install --no-audit --no-fund
      - name: Level lint, completability, medals, flow, boss, mechanics
        working-directory: tools
        run: npm test
