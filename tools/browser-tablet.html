<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平板布局验收</title><style>body{font:15px system-ui;background:#10162b;color:#e5efff;margin:20px}pre{white-space:pre-wrap}button{padding:12px}</style><h1>平板浏览器布局检查</h1><p>实际 HTML / CSS，在不同尺寸 iframe 中验证按键和菜单边界。测试不代替物理触屏手感验收。</p><pre id="out">加载中</pre><script>window.SSLTabletQABase='../index.html';</script><script src="browser-tablet.js"></script><script>window.qaStatus='running';SSLTabletQA().then(r=>{window.qaResults=r;window.qaStatus='done';document.getElementById('out').textContent=JSON.stringify(r.map(({width,height,fails,error})=>({width,height,fails,error})),null,2)}).catch(e=>{window.qaStatus='error';document.getElementById('out').textContent=String(e)});</script></html>
